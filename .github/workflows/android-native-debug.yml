name: Native Android debug build
# Compile native changes on main; no production signing or deployment.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-debug.yml'
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 37 with the runner's official command-line tools
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Check Expo-to-Compose source UX contract
        run: node --test android-native/tests/*.test.mjs
      - name: Compile and run native unit tests
        working-directory: android-native
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Record checksum
        working-directory: android-native
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DOMINION-Assistant-Native-debug
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
