name: Assistant voice companion contracts
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assistant-voice-contracts
  cancel-in-progress: true
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install document parser
        run: python3 -m pip install 'pypdf==7.1.1'
      - name: Offline protocol tests
        run: |
          python3 -m unittest discover -s . -p 'test_*.py'
          python3 -m py_compile *.py
          node --check app.js
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Native client type and Expo configuration
        working-directory: mobile
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run typecheck
          npx expo config --type public
